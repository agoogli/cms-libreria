services:
  db:
    image: docker.io/library/postgres:15-alpine
    container_name: cms-libreria-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  payloadcms:
    image: ghcr.io/agoogli/cms-libreria:latest
    container_name: cms-libreria-app
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - db
volumes:
  postgres_data:
